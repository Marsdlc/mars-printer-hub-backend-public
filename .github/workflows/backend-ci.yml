name: Backend CI/CD
run-name: 发布 ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1️⃣ 拉取代码 (🔥 修改：必须拉取完整历史，才能读取 Tag 信息)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ 设置 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3️⃣ 解析版本号
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME}
          DATE=$(date -u +"%Y-%m-%d")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

      # 4️⃣ 将版本号写入 application-version.yml
      - name: Write version to application-version.yml
        run: |
          mkdir -p src/main/resources
          echo "version: ${VERSION}" > src/main/resources/application-version.yml

      # 5️⃣ 获取 Tag 标题（使用附注标签的消息）
      - name: Fetch tag message
        id: info
        run: |
          TAG_REF="refs/tags/${GITHUB_REF_NAME}"
          TITLE=""

          # checkout 会将当前附注标签覆盖成提交引用，读取前重新获取标签对象。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git fetch --force origin "${TAG_REF}:${TAG_REF}"
          fi

          # 只有附注标签的对象类型才是 tag；轻量标签的对象类型是 commit。
          if git show-ref --verify --quiet "$TAG_REF" && [ "$(git cat-file -t "$TAG_REF")" = "tag" ]; then
            TITLE=$(git for-each-ref --format='%(contents:subject)' "$TAG_REF")
          fi

          # 未填写标签消息时使用版本号，避免把最后一次 Commit 标题当成版本标题。
          if [ -z "$TITLE" ]; then
            TITLE="${VERSION}"
          fi

          echo "Final Title: $TITLE"
          echo "TITLE=${TITLE}" >> "$GITHUB_ENV"

      # 6️⃣ 构建后端 jar
      - name: Build backend jar
        run: ./mvnw -B clean package -DskipTests

      # 7️⃣ Docker 元数据
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/mars-printer-hub-backend
            registry.cn-shenzhen.aliyuncs.com/marsss/mars-printer-hub-backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # 8️⃣ 多架构支持
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 9️⃣ 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🔟 登录阿里云 ACR
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 1️⃣1️⃣ 构建并推送镜像
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Aliyun ACR does not support Buildx's OCI attestation manifests.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1️⃣2️⃣ 生成完整 version.json
      - name: Generate version.json
        run: |
          mkdir -p public_upload
          cat > public_upload/version.json <<EOF
          {
            "latest": "${VERSION}",
            "publishedAt": "${DATE}",
            "title": "${TITLE}"
          }
          EOF

      # 1️⃣3️⃣ 上传 version.json 到 Cloudflare R2
      - name: Upload version.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: 'us-east-1'
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws s3 cp public_upload/version.json s3://$R2_BUCKET/version.json \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --acl public-read
